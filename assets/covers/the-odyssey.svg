<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
    <defs>
        <!-- Subtle paper & cloth grain textures -->
        <linearGradient id="clothSheen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
            <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.0" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
        </linearGradient>
        <radialGradient id="centerGlow" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0.12" />
        </radialGradient>
        <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
        </filter>
    </defs>

    <!-- Base Book Cloth Background -->
    <rect width="600" height="900" fill="#95A8BA" />
    <rect width="600" height="900" fill="url(#centerGlow)" />
    <rect width="600" height="900" fill="url(#clothSheen)" />

    <!-- Spine Crease Shadow (Left Edge) -->
    <rect x="0" y="0" width="18" height="900" fill="#000000" fill-opacity="0.14" />
    <line x1="18" y1="0" x2="18" y2="900" stroke="#F7F3EB" stroke-opacity="0.15" stroke-width="1" />

    <!-- Outer Inset Gilded / Cream Foil Frame -->
    <rect x="36" y="36" width="528" height="828" fill="none" stroke="#F7F3EB" stroke-width="2" stroke-opacity="0.85" rx="4" />
    <rect x="44" y="44" width="512" height="812" fill="none" stroke="#F7F3EB" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="4,4" />

    <!-- Corner Filigree Accents -->
    <path d="M 44 64 L 64 44 M 44 74 L 74 44" stroke="#F7F3EB" stroke-width="1.5" stroke-opacity="0.7" />
    <path d="M 556 64 L 536 44 M 556 74 L 526 44" stroke="#F7F3EB" stroke-width="1.5" stroke-opacity="0.7" />
    <path d="M 44 836 L 64 856 M 44 826 L 74 856" stroke="#F7F3EB" stroke-width="1.5" stroke-opacity="0.7" />
    <path d="M 556 836 L 536 856 M 556 826 L 526 856" stroke="#F7F3EB" stroke-width="1.5" stroke-opacity="0.7" />

    <!-- Header Category Tag -->
    <text x="300" y="115" text-anchor="middle" fill="#F7F3EB" fill-opacity="0.9" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.25em">CLASSICS</text>
    <line x1="220" y1="135" x2="380" y2="135" stroke="#F7F3EB" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="300" cy="135" r="2.5" fill="#F7F3EB" fill-opacity="0.8" />

    <!-- Central Bespoke Vector Literary Motif -->
    <g transform="translate(0, 0)">
        
        <!-- Ancient Greek Trireme Galley & Waves -->
        <g stroke="#F7F3EB" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 230 335 Q 260 340 300 340 Q 345 340 375 315 L 360 345 Q 300 360 240 350 Z" fill="#F7F3EB" fill-opacity="0.2" />
            <line x1="300" y1="340" x2="300" y2="265" stroke-width="3" />
            <path d="M 300 270 L 345 290 L 300 310 Z" fill="#F7F3EB" fill-opacity="0.3" />
            <line x1="260" y1="345" x2="250" y2="365" />
            <line x1="280" y1="345" x2="270" y2="365" />
            <line x1="300" y1="345" x2="290" y2="365" />
            <line x1="320" y1="345" x2="310" y2="365" />
            <path d="M 220 375 Q 260 365 300 375 T 380 375" />
        </g>
    
    </g>

    <!-- Book Title -->
    <g id="coverTitle">
        <text x="300" y="510.0" text-anchor="middle" fill="#F7F3EB" font-family="Newsreader, Georgia, serif" font-size="32" font-weight="600" letter-spacing="-0.01em">The Odyssey</text>
    </g>

    <!-- Elegant Hairline Rule -->
    <line x1="250" y1="675" x2="350" y2="675" stroke="#F7F3EB" stroke-opacity="0.65" stroke-width="1.5" />
    <circle cx="300" cy="675" r="3" fill="#F7F3EB" fill-opacity="0.85" />

    <!-- Author Name -->
    <text x="300" y="725" text-anchor="middle" fill="#F7F3EB" font-family="Newsreader, Georgia, serif" font-size="20" font-style="italic" font-weight="400" letter-spacing="0.03em">Homer</text>

    <!-- Footer: Year & Nook Classic Edition -->
    <line x1="200" y1="785" x2="400" y2="785" stroke="#F7F3EB" stroke-opacity="0.3" stroke-width="1" />
    <text x="300" y="815" text-anchor="middle" fill="#F7F3EB" fill-opacity="0.8" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500" letter-spacing="0.18em">NOOK EDITION · 800 BCE</text>
</svg>