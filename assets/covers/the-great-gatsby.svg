<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
    <defs>
        <!-- Subtle paper & cloth grain textures -->
        <linearGradient id="clothSheen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
            <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.0" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
        </linearGradient>
        <radialGradient id="centerGlow" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0.12" />
        </radialGradient>
        <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
        </filter>
    </defs>

    <!-- Base Book Cloth Background -->
    <rect width="600" height="900" fill="#9E829F" />
    <rect width="600" height="900" fill="url(#centerGlow)" />
    <rect width="600" height="900" fill="url(#clothSheen)" />

    <!-- Spine Crease Shadow (Left Edge) -->
    <rect x="0" y="0" width="18" height="900" fill="#000000" fill-opacity="0.14" />
    <line x1="18" y1="0" x2="18" y2="900" stroke="#F6EFF7" stroke-opacity="0.15" stroke-width="1" />

    <!-- Outer Inset Gilded / Cream Foil Frame -->
    <rect x="36" y="36" width="528" height="828" fill="none" stroke="#F6EFF7" stroke-width="2" stroke-opacity="0.85" rx="4" />
    <rect x="44" y="44" width="512" height="812" fill="none" stroke="#F6EFF7" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="4,4" />

    <!-- Corner Filigree Accents -->
    <path d="M 44 64 L 64 44 M 44 74 L 74 44" stroke="#F6EFF7" stroke-width="1.5" stroke-opacity="0.7" />
    <path d="M 556 64 L 536 44 M 556 74 L 526 44" stroke="#F6EFF7" stroke-width="1.5" stroke-opacity="0.7" />
    <path d="M 44 836 L 64 856 M 44 826 L 74 856" stroke="#F6EFF7" stroke-width="1.5" stroke-opacity="0.7" />
    <path d="M 556 836 L 536 856 M 556 826 L 526 856" stroke="#F6EFF7" stroke-width="1.5" stroke-opacity="0.7" />

    <!-- Header Category Tag -->
    <text x="300" y="115" text-anchor="middle" fill="#F6EFF7" fill-opacity="0.9" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.25em">CLASSICS</text>
    <line x1="220" y1="135" x2="380" y2="135" stroke="#F6EFF7" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="300" cy="135" r="2.5" fill="#F6EFF7" fill-opacity="0.8" />

    <!-- Central Bespoke Vector Literary Motif -->
    <g transform="translate(0, 0)">
        
        <!-- 1920s Art-Deco Geometric Sunburst -->
        <g stroke="#F6EFF7" stroke-width="2" fill="none" stroke-linecap="round">
            <path d="M 230 360 L 300 260 L 370 360 Z" stroke-width="2.5" />
            <path d="M 245 360 L 300 280 L 355 360 Z" />
            <path d="M 260 360 L 300 300 L 340 360 Z" />
            <line x1="300" y1="240" x2="300" y2="215" stroke-width="2.5" />
            <line x1="270" y1="248" x2="250" y2="230" stroke-width="2" />
            <line x1="330" y1="248" x2="350" y2="230" stroke-width="2" />
            <line x1="245" y1="270" x2="220" y2="260" stroke-width="2" />
            <line x1="355" y1="270" x2="380" y2="260" stroke-width="2" />
            <circle cx="300" cy="360" r="5" fill="#F6EFF7" />
        </g>
    
    </g>

    <!-- Book Title -->
    <g id="coverTitle">
        <text x="300" y="510.0" text-anchor="middle" fill="#F6EFF7" font-family="Newsreader, Georgia, serif" font-size="32" font-weight="600" letter-spacing="-0.01em">The Great Gatsby</text>
    </g>

    <!-- Elegant Hairline Rule -->
    <line x1="250" y1="675" x2="350" y2="675" stroke="#F6EFF7" stroke-opacity="0.65" stroke-width="1.5" />
    <circle cx="300" cy="675" r="3" fill="#F6EFF7" fill-opacity="0.85" />

    <!-- Author Name -->
    <text x="300" y="725" text-anchor="middle" fill="#F6EFF7" font-family="Newsreader, Georgia, serif" font-size="20" font-style="italic" font-weight="400" letter-spacing="0.03em">F. Scott Fitzgerald</text>

    <!-- Footer: Year & Nook Classic Edition -->
    <line x1="200" y1="785" x2="400" y2="785" stroke="#F6EFF7" stroke-opacity="0.3" stroke-width="1" />
    <text x="300" y="815" text-anchor="middle" fill="#F6EFF7" fill-opacity="0.8" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500" letter-spacing="0.18em">NOOK EDITION · 1925</text>
</svg>