<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <!-- Soft Pastel Grain & Shimmer Filters -->
    <linearGradient id="clothSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </radialGradient>
    <filter id="gentleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2C1820" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Base Cozy Pastel Book Background -->
  <rect width="600" height="900" fill="#F4F0F8" />
  <rect width="600" height="900" fill="url(#sunGlow)" />
  <rect width="600" height="900" fill="url(#clothSheen)" />

  <!-- Authentic Left Spine Crease Shadow -->
  <rect x="0" y="0" width="16" height="900" fill="#000000" fill-opacity="0.12" />
  <line x1="16" y1="0" x2="16" y2="900" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Outer Decorative Storybook Pastel Frame -->
  <rect x="32" y="32" width="536" height="836" fill="none" stroke="#C8BAD8" stroke-width="2.5" rx="6" />
  <rect x="40" y="40" width="520" height="820" fill="none" stroke="#C8BAD8" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.6" rx="4" />

  <!-- Corner Flourish Accents & Stars -->
  <g fill="#947AB4" stroke="#947AB4">
    <path d="M 46 68 Q 68 68, 68 46" fill="none" stroke-width="2" />
    <circle cx="56" cy="56" r="3" />
    <path d="M 554 68 Q 532 68, 532 46" fill="none" stroke-width="2" />
    <circle cx="544" cy="56" r="3" />
    <path d="M 46 832 Q 68 832, 68 854" fill="none" stroke-width="2" />
    <circle cx="56" cy="844" r="3" />
    <path d="M 554 832 Q 532 832, 532 854" fill="none" stroke-width="2" />
    <circle cx="544" cy="844" r="3" />
  </g>

  <!-- Top Nook Edition Header Banner -->
  <g transform="translate(300, 78)">
    <text text-anchor="middle" fill="#4A3660" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.22em" opacity="0.85">✦  A NOOK EDITION  ·  1847  ✦</text>
  </g>

  <!-- Book Title in Elegant Serif Display -->
  <g id="coverTitle">
    
      <text x="300" y="165" text-anchor="middle" fill="#4A3660" font-family="Fraunces, 'Playfair Display', Georgia, serif" font-size="42" font-weight="600" letter-spacing="-0.02em" filter="url(#gentleShadow)">Jane Eyre</text>
    
  </g>

  <!-- Author Name -->
  <text x="300" y="213" text-anchor="middle" fill="#4A3660" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.18em" opacity="0.85">CHARLOTTE BRONTË</text>

  <!-- Middle Storybook Illustrated Scene & Objects -->
  <g id="coverIllustration">
    
        <!-- Classic Cozy Library Window & Shelf Backdrop -->
        <rect x="120" y="260" width="360" height="320" rx="16" fill="#F4EFE6" stroke="#C8BAD8" stroke-width="2" />
        <path d="M 140 330 C 140 260, 460 260, 460 330 L 460 560 L 140 560 Z" fill="#E8F0F4" stroke="#C8BAD8" stroke-width="2" />
        <line x1="300" y1="270" x2="300" y2="560" stroke="#C8BAD8" stroke-width="2" />
        <line x1="140" y1="400" x2="460" y2="400" stroke="#C8BAD8" stroke-width="2" />
      
    
    <!-- Wooden / Marble Tabletop Surface with Depth -->
    <rect x="40" y="560" width="520" height="220" fill="#FAF6EE" stroke="#C8BAD8" stroke-width="2" rx="4" />
    <rect x="40" y="560" width="520" height="14" fill="#EAE2D4" />
  
      <!-- Elegant Pastel Stacked Leather Books with Spine Foil -->
      <g transform="translate(100, 520)">
        <!-- Book 1 (Bottom) -->
        <rect x="0" y="120" width="200" height="34" rx="3" fill="#4A3660" filter="drop-shadow(2px 5px 6px rgba(0,0,0,0.12))" />
        <rect x="5" y="123" width="190" height="28" fill="none" stroke="#D4B066" stroke-width="1" stroke-opacity="0.7" rx="2" />
        <text x="100" y="142" text-anchor="middle" fill="#FFFFFF" font-family="Fraunces, serif" font-size="14" font-weight="600" letter-spacing="0.08em">A Fuller Life</text>
        <!-- Book 2 (Middle) -->
        <rect x="15" y="85" width="180" height="32" rx="3" fill="#947AB4" filter="drop-shadow(2px 4px 5px rgba(0,0,0,0.1))" />
        <rect x="20" y="88" width="170" height="26" fill="none" stroke="#D4B066" stroke-width="1" stroke-opacity="0.7" rx="2" />
        <text x="105" y="106" text-anchor="middle" fill="#FFFFFF" font-family="Fraunces, serif" font-size="13" font-weight="600" letter-spacing="0.08em">Self-Respect</text>
        <!-- Book 3 (Top) -->
        <rect x="30" y="52" width="160" height="30" rx="3" fill="#789484" filter="drop-shadow(2px 3px 4px rgba(0,0,0,0.08))" />
        <rect x="34" y="55" width="152" height="24" fill="none" stroke="#D4B066" stroke-width="1" stroke-opacity="0.7" rx="2" />
        <text x="110" y="72" text-anchor="middle" fill="#FFFFFF" font-family="Fraunces, serif" font-size="13" font-weight="600" letter-spacing="0.08em">Independence</text>
      </g>
    
      <!-- Lit Brass Candlestick with Glowing Flame -->
      <g transform="translate(370, 480)">
        <ellipse cx="40" cy="180" rx="30" ry="8" fill="#D4AF67" stroke="#9A7836" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.15))" />
        <rect x="34" y="90" width="12" height="90" fill="#D4AF67" stroke="#9A7836" stroke-width="1.5" />
        <!-- White Candle Wax Column with Drips -->
        <rect x="36" y="20" width="8" height="70" fill="#FFFDF4" rx="1" />
        <path d="M 36 35 Q 33 42, 36 50" stroke="#FFFDF4" stroke-width="3" fill="none" stroke-linecap="round" />
        <line x1="40" y1="20" x2="40" y2="12" stroke="#222" stroke-width="1.5" />
        <!-- Glowing Warm Candle Flame -->
        <circle cx="40" cy="10" r="16" fill="#FFEAA0" fill-opacity="0.35" filter="drop-shadow(0 0 10px #FFD040)" />
        <path d="M 40 2 C 34 8, 35 15, 40 18 C 45 15, 46 8, 40 2 Z" fill="#FFA834" />
        <path d="M 40 6 C 37 10, 38 14, 40 16 C 42 14, 43 10, 40 6 Z" fill="#FFF8C0" />
      </g>
    
  </g>

  <!-- Bottom Genre Category Banner -->
  <g transform="translate(300, 818)">
    <line x1="-120" y1="-14" x2="120" y2="-14" stroke="#C8BAD8" stroke-width="1.5" opacity="0.6" />
    <circle cx="0" cy="-14" r="3" fill="#947AB4" />
    <text y="8" text-anchor="middle" fill="#4A3660" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.22em" opacity="0.85">ROMANCE · GOTHIC</text>
  </g>
</svg>