<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <!-- Soft Pastel Grain & Shimmer Filters -->
    <linearGradient id="clothSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </radialGradient>
    <filter id="gentleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2C1820" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Base Cozy Pastel Book Background -->
  <rect width="600" height="900" fill="#FEF7EE" />
  <rect width="600" height="900" fill="url(#sunGlow)" />
  <rect width="600" height="900" fill="url(#clothSheen)" />

  <!-- Authentic Left Spine Crease Shadow -->
  <rect x="0" y="0" width="16" height="900" fill="#000000" fill-opacity="0.12" />
  <line x1="16" y1="0" x2="16" y2="900" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Outer Decorative Storybook Pastel Frame -->
  <rect x="32" y="32" width="536" height="836" fill="none" stroke="#E6BA9A" stroke-width="2.5" rx="6" />
  <rect x="40" y="40" width="520" height="820" fill="none" stroke="#E6BA9A" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.6" rx="4" />

  <!-- Corner Flourish Accents & Stars -->
  <g fill="#C88656" stroke="#C88656">
    <path d="M 46 68 Q 68 68, 68 46" fill="none" stroke-width="2" />
    <circle cx="56" cy="56" r="3" />
    <path d="M 554 68 Q 532 68, 532 46" fill="none" stroke-width="2" />
    <circle cx="544" cy="56" r="3" />
    <path d="M 46 832 Q 68 832, 68 854" fill="none" stroke-width="2" />
    <circle cx="56" cy="844" r="3" />
    <path d="M 554 832 Q 532 832, 532 854" fill="none" stroke-width="2" />
    <circle cx="544" cy="844" r="3" />
  </g>

  <!-- Top Nook Edition Header Banner -->
  <g transform="translate(300, 78)">
    <text text-anchor="middle" fill="#764A28" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.22em" opacity="0.85">✦  A NOOK EDITION  ·  1908  ✦</text>
  </g>

  <!-- Book Title in Elegant Serif Display -->
  <g id="coverTitle">
    
      <text x="300" y="148" text-anchor="middle" fill="#764A28" font-family="Fraunces, 'Playfair Display', Georgia, serif" font-size="38" font-weight="600" letter-spacing="-0.02em" filter="url(#gentleShadow)">A Room with</text>
    
      <text x="300" y="192" text-anchor="middle" fill="#764A28" font-family="Fraunces, 'Playfair Display', Georgia, serif" font-size="38" font-weight="600" letter-spacing="-0.02em" filter="url(#gentleShadow)">a View</text>
    
  </g>

  <!-- Author Name -->
  <text x="300" y="240" text-anchor="middle" fill="#764A28" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.18em" opacity="0.85">E. M. FORSTER</text>

  <!-- Middle Storybook Illustrated Scene & Objects -->
  <g id="coverIllustration">
    
        <!-- Classic Cozy Library Window & Shelf Backdrop -->
        <rect x="120" y="260" width="360" height="320" rx="16" fill="#F4EFE6" stroke="#E6BA9A" stroke-width="2" />
        <path d="M 140 330 C 140 260, 460 260, 460 330 L 460 560 L 140 560 Z" fill="#E8F0F4" stroke="#E6BA9A" stroke-width="2" />
        <line x1="300" y1="270" x2="300" y2="560" stroke="#E6BA9A" stroke-width="2" />
        <line x1="140" y1="400" x2="460" y2="400" stroke="#E6BA9A" stroke-width="2" />
      
    
    <!-- Wooden / Marble Tabletop Surface with Depth -->
    <rect x="40" y="560" width="520" height="220" fill="#FAF6EE" stroke="#E6BA9A" stroke-width="2" rx="4" />
    <rect x="40" y="560" width="520" height="14" fill="#EAE2D4" />
  
      <!-- Whimsical Stacked Teacups & Drink Me Bottle -->
      <g transform="translate(110, 480)">
        <!-- Bottom Teacup with Saucer -->
        <ellipse cx="60" cy="180" rx="45" ry="10" fill="#E8EEF4" stroke="#E6BA9A" stroke-width="2" />
        <path d="M 25 140 C 25 175, 95 175, 95 140 Z" fill="#FFFFFF" stroke="#E6BA9A" stroke-width="2" />
        <path d="M 95 145 C 110 145, 110 165, 95 165" stroke="#E6BA9A" stroke-width="3" fill="none" />
        <circle cx="50" cy="155" r="4" fill="#F288A0" /><circle cx="70" cy="155" r="4" fill="#F288A0" />
        <!-- Middle Teacup (Tilted) -->
        <g transform="translate(20, 95) rotate(-8)">
          <path d="M 25 20 C 25 50, 85 50, 85 20 Z" fill="#FDF2F5" stroke="#E6BA9A" stroke-width="2" />
          <path d="M 85 25 C 98 25, 98 42, 85 42" stroke="#E6BA9A" stroke-width="2.5" fill="none" />
          <text x="55" y="38" text-anchor="middle" fill="#E8587C" font-size="12">♥</text>
        </g>
      </g>
    
  </g>

  <!-- Bottom Genre Category Banner -->
  <g transform="translate(300, 818)">
    <line x1="-120" y1="-14" x2="120" y2="-14" stroke="#E6BA9A" stroke-width="1.5" opacity="0.6" />
    <circle cx="0" cy="-14" r="3" fill="#C88656" />
    <text y="8" text-anchor="middle" fill="#764A28" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.22em" opacity="0.85">ROMANCE · CLASSIC</text>
  </g>
</svg>